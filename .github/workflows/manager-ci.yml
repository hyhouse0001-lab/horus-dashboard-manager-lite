name: Dashboard Manager Safety Checks
on:
  push:
    paths:
      - "horus_dashboard_manager/**"
      - "horus_blink_event_receiver/**"
      - "horus_update_watcher/**"
      - "tests/**"
      - ".github/workflows/manager-ci.yml"
  pull_request:
    paths:
      - "horus_dashboard_manager/**"
      - "horus_blink_event_receiver/**"
      - "tests/**"
      - ".github/workflows/manager-ci.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python without running it
        run: python -m py_compile horus_dashboard_manager/manager.py horus_update_watcher/watcher.py horus_blink_event_receiver/app.py
      - name: Single-target safety tests
        run: python -m unittest discover -s tests -v
      - name: Build pinned upstream receiver and verify adapter imports
        if: contains(github.event.head_commit.message, 'Blink') || github.event_name == 'pull_request'
        run: |
          docker build -t horus-blink-test horus_blink_event_receiver
          docker run --rm --entrypoint python horus-blink-test -c 'import horus_blink_app; from receiver.blink_live_events import daemon, ha_delivery, blink_account; assert callable(daemon.listen) and callable(ha_delivery.HomeAssistantWebhook) and callable(blink_account._authorization_url) and callable(blink_account._callback_code) and callable(blink_account.associate_fcm_token)'
